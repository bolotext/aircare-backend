services:

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: aircare_users
    env_file:
      - services/users/.env
    environment:
      # Worker process count (no --reload in this production entrypoint —
      # see services/users/entrypoint.sh). Defaults to 2 if unset; override
      # here per environment, e.g. WEB_CONCURRENCY: "4".
      # WEB_CONCURRENCY: "2"
    networks:
      - aircare-network
    restart: always

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: aircare_api_gateway
    ports:
      - 45454:8000
    env_file:
      - services/api-gateway/.env
    environment:
      USERS_SERVICE_URL: http://users:8001
      REPORTS_SERVICE_URL: http://reports:8002
      MCP_CLIENTS_SERVICE_URL: http://mcp-clients:8003
      # Worker process count (no --reload in this production entrypoint —
      # see services/api-gateway/entrypoint.sh). Defaults to 2 if unset;
      # override here per environment, e.g. WEB_CONCURRENCY: "4".
      # WEB_CONCURRENCY: "2"
    depends_on:
      - users
      - reports
      - mcp-clients
    networks:
      - aircare-network
    restart: always

  mcp-clients:
    build:
      context: .
      dockerfile: services/mcp_clients/Dockerfile
    container_name: aircare_mcp_clients
    ports:
      - 45455:8003
    env_file:
      - services/mcp_clients/.env
    environment:
      # Override the .env file's localhost-based connection strings with the
      # docker-network hostnames (see services/mcp_clients/.env: both MCP
      # server subprocesses are spawned with these in their own env).
      # REDIS_MCP_URL: redis://redis:6379/0
      # ^ no "redis" service exists in this compose file yet — add one and
      # uncomment this once it does; until then this points at .env's
      # localhost default, which won't resolve inside the container.
    networks:
      - aircare-network
    restart: always

  reports:
    build:
      context: .
      dockerfile: services/reports/Dockerfile
    container_name: aircare_reports
    env_file:
      - services/reports/.env
    environment:
      USERS_SERVICE_URL: http://users:8001
      # Worker process count (no --reload in this production entrypoint —
      # see services/reports/entrypoint.sh). Defaults to 2 if unset; override
      # here per environment, e.g. WEB_CONCURRENCY: "4".
      # WEB_CONCURRENCY: "2"
    depends_on:
      - users
    networks:
      - aircare-network
    restart: always

networks:
  aircare-network:
    driver: bridge