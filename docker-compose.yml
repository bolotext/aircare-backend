services:

  # The whole backend (users + reports) as one app on :8000.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: manappuram_backend
    container_name: manappuram_backend
    # host networking so MONGO_URI=mongodb://localhost:27017 reaches a Mongo on the host.
    network_mode: host
    env_file:
      - .env
    environment:
      # Worker process count (no --reload in this entrypoint). Defaults to 2.
      # WEB_CONCURRENCY: "4"
      HOST: 0.0.0.0
    restart: always

  # Daily report-email loop — its own process, same image. Start it with:
  #   docker compose --profile scheduler up -d
  # scheduler:
  #   profiles: ["scheduler"]
  #   image: manappuram_backend
  #   container_name: manappuram_scheduler
  #   network_mode: host
  #   env_file:
  #     - .env
  #   entrypoint: ["python", "src/main.py", "schedule"]
  #   depends_on:
  #     - backend
  #   restart: always
