[project]
name = "mcp-clients-service"
version = "0.1.0"
description = "MCP clients + the teleconsultation identity-verification/slot-booking API a voice agent calls mid-call."
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "mcp>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv.sources]
common = { workspace = true }

[tool.uv]
package = false
